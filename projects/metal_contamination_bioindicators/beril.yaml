project_id: metal_contamination_bioindicators
status: reviewed
title: Microbial Indicator Taxa for Soil Metal Contamination
description: 'Tests whether genus-level 16S community composition predicts soil metal
  contamination risk (exceedance probability for 7 metals: As/Cd/Co/Cr/Cu/Ni/Pb) after
  controlling for soil chemistry (pH, SOC, clay fraction). Uses arkinlab.microbeatlas
  (278K samples, global) joined to science_2025_global_soil_toxic_metals (2.05M grid
  points, exceedance probabilities 0–1 for AT and HHET thresholds). Soil chemistry
  covariates from soilgrids_master (pH/SOC/clay/CEC at 0–5 cm). Metal source comparison:
  science_2025 (contamination risk) vs GeoROC (geological background) vs CSU metal
  mobility grid (mobile fraction). Functional validation: do indicator genera carry
  elevated metal gene density in SPIRE MAGs?

  '
