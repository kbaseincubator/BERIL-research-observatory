const phylumColors = ['var(--sig)', '#e34948', '#eda100', '#6b9e8a', 'var(--ns)'];

function drawHistogram(container, hist, coeffs) {
  const w = 260, h = 200, pad = 40;
  const maxCount = Math.max(...hist.counts);
  const edges = hist.edges;
  const counts = hist.counts;
  const binWidth = (w - 2*pad) / counts.length;

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;

  // x-axis (counts)
  svg += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--gl)" stroke-width="1"/>`;
  // y-axis (genome size)
  svg += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--gl)" stroke-width="1"/>`;

  // bins
  counts.forEach((cnt, i) => {
    const barHeight = (cnt / maxCount) * (h - 2*pad);
    const x = pad + i * binWidth;
    svg += `<rect x="${x}" y="${h - pad - barHeight}" width="${binWidth - 1}" height="${barHeight}" fill="var(--sig)" opacity="0.6"/>`;
  });

  // x-axis label
  svg += `<text x="${w/2}" y="${h-5}" font-size="10" fill="var(--ts)" text-anchor="middle">Genome size (Mb)</text>`;

  svg += `</svg>`;
  container.innerHTML = svg;
}

function drawScatter(container, points, coeffs, ylabel, title) {
  const w = 260, h = 200, pad = 40;
  const xs = points.map(p => p[0]);
  const ys = points.map(p => p[1]);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const xRange = xMax - xMin, yRange = yMax - yMin;

  const scaleX = (x) => pad + ((x - xMin) / xRange) * (w - 2*pad);
  const scaleY = (y) => (h - pad) - ((y - yMin) / yRange) * (h - 2*pad);

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;

  // axes
  svg += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--gl)" stroke-width="1"/>`;
  svg += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--gl)" stroke-width="1"/>`;

  // trend line
  if (coeffs) {
    const x1 = xMin, y1 = coeffs[0]*x1 + coeffs[1];
    const x2 = xMax, y2 = coeffs[0]*x2 + coeffs[1];
    const line_x1 = scaleX(x1), line_y1 = scaleY(y1);
    const line_x2 = scaleX(x2), line_y2 = scaleY(y2);
    svg += `<line x1="${line_x1}" y1="${line_y1}" x2="${line_x2}" y2="${line_y2}" stroke="var(--sig)" stroke-width="1.5" opacity="0.5"/>`;
  }

  // points
  points.forEach(pt => {
    const [x, y, phylumSlot] = pt;
    const cx = scaleX(x), cy = scaleY(y);
    const color = phylumColors[phylumSlot];
    svg += `<circle cx="${cx}" cy="${cy}" r="3" fill="${color}" opacity="0.7"/>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;
}
