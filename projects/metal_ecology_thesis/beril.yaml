project_id: metal_ecology_thesis
status: analysis
title: 'Microbial Metal Ecology: Turnover vs Gene Gain in Global Soil Communities'
description: >
  Integrated synthesis of six completed analyses addressing the central thesis question:
  does metal contamination select for metal-tolerant lineages (community turnover) or
  drive metal resistance gene gain within resident lineages? All sub-analyses are
  complete; this project provides the unified pre-registered analysis plan and
  cross-project synthesis.

  Sub-analyses (all complete):
    1. comprehensive_metal_ecology      — PGLS: niche breadth vs metal gene density (1,574 genera)
    2. per_ko_metal_associations        — MWAS: 6,451 KOs × 6 metals (8,585 MAGs)
    3. community_composition_prediction — ML: taxon community → metal prediction
    4. enigma_stress_phenotype_ml       — ENIGMA isolate sequence → metal fitness (AUC 0.556–0.779)
    5. metagenomic_environment_prediction — MAG-level metal prediction (SPIRE + MGnify)
    6. mwas_confound_analysis           — MWAS collinearity control: 1,097 → 2–4 true hits

